<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maximilien Duchamp | Contact Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-contact">
  <section class="hero">
    <!-- Static background image (no video on the contact page). -->
    <div class="hero__bg"></div>
    <div class="hero__overlay"></div>

    <!-- Top bar -->
    <header class="header">
      <a href="index.html" class="logo" aria-label="Maximilien Duchamp — Home">
        Maximilien Duchamp
      </a>

      <!-- Desktop navigation -->
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html" class="nav__link" data-en="Home" data-fr="Accueil">Home</a>
        <a href="projects.html" class="nav__link" data-en="Projects" data-fr="Projets">Projects</a>
        <a href="contact.html" class="nav__link nav__link--active" data-en="Contact Me" data-fr="Contact">Contact Me</a>
        <!-- Language switch inside the mobile dropdown menu -->
        <button class="lang-switch lang-switch--menu" type="button" data-lang-switch aria-label="Switch language"></button>
      </nav>

      <!-- Language switch in the top-right corner (desktop) -->
      <button class="lang-switch lang-switch--top" type="button" data-lang-switch aria-label="Switch language"></button>

      <!-- Mobile menu button -->
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
        <span class="menu-toggle__label">Menu</span>
        <span class="menu-toggle__icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </header>

    <!-- Centered content -->
    <div class="hero__content">
      <div class="contact">
        <h1 class="contact__title" data-en="CONTACT ME" data-fr="ME CONTACTER">CONTACT ME</h1>
        <p class="contact__intro"
           data-en="Tell me about your project and I'll get back to you."
           data-fr="Parlez-moi de votre projet et je vous recontacterai.">
          Tell me about your project and I'll get back to you.
        </p>

        <a class="contact__email" href="mailto:duchamp.maximilien@gmail.com">duchamp.maximilien@gmail.com</a>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
